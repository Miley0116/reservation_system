<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約フォーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .required {
            color: red;
            margin-left: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="time"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .link-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .link-section a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .link-section a:hover {
            text-decoration: underline;
        }

        .admin-link {
            text-align: center;
            margin-top: 15px;
        }

        .admin-link a {
            color: #999;
            text-decoration: none;
            font-size: 12px;
        }

        .messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 予約フォーム</h1>
        <p class="subtitle">以下のフォームにご記入の上、予約を確定してください</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" style="margin-top: 30px;">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">お名前<span class="required">*</span></label>
                <input type="text" id="name" name="name" value="{{ name }}" required placeholder="山田 太郎">
            </div>

            <div class="form-group">
                <label for="phone_number">電話番号<span class="required">*</span></label>
                <input type="tel" id="phone_number" name="phone_number" value="{{ phone_number }}" required placeholder="090-1234-5678">
            </div>

            <div class="form-group">
                <label for="email">メールアドレス<span class="required">*</span></label>
                <input type="email" id="email" name="email" value="{{ email }}" required placeholder="example@example.com">
            </div>

            <div class="form-group">
                <label for="reservation_date">予約日<span class="required">*</span></label>
                <input type="date" id="reservation_date" name="reservation_date" value="{{ reservation_date }}" required min="{{ today|date:'Y-m-d' }}">
            </div>

            <div class="form-group">
                <label for="reservation_time">予約時間<span class="required">*</span></label>
                <input type="time" id="reservation_time" name="reservation_time" value="{{ reservation_time }}" required>
            </div>

            <div class="form-group">
                <label for="service">サービス内容<span class="required">*</span></label>
                <input type="text" id="service" name="service" value="{{ service }}" required placeholder="例：カット、カラー、パーマ">
            </div>

            <div class="form-group">
                <label for="duration">所要時間（分）<span class="required">*</span></label>
                <input type="number" id="duration" name="duration" value="{% if duration %}{{ duration }}{% else %}60{% endif %}" required min="15" step="15">
            </div>

            <div class="form-group">
                <label for="memo">備考</label>
                <textarea id="memo" name="memo" placeholder="特記事項があればご記入ください">{{ memo }}</textarea>
            </div>

            <!-- 参考画像 -->
            <div class="form-group">
                <label for="reference_image">参考画像（任意）</label>
                <input type="file" id="reference_image" name="reference_image" accept="image/*" style="padding: 8px;">
                <small style="display: block; color: #666; margin-top: 5px;">ご希望のヘアスタイルなど、参考となる画像をアップロードしてください</small>
            </div>

            <button type="submit">予約を確定する</button>
        </form>

        <script>
        // 日付入力のカスタムバリデーションメッセージ
        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('reservation_date');
    
            dateInput.addEventListener('invalid', function(e) {
                e.preventDefault();
                this.setCustomValidity('今日以降の日付を選択してください');
            });
    
            dateInput.addEventListener('input', function() {
                this.setCustomValidity('');
            });
        });
        </script>

        <div class="link-section">
            <a href="{% url 'public_booking_check' %}">📋 予約を確認する</a>
        </div>

        <div class="admin-link">
            <a href="{% url 'login' %}">管理者ログイン</a>
        </div>
    </div>
</body>
</html>
