<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約フォーム</title>

    <!-- PDF.jsのCDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .required {
            color: red;
            margin-left: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="time"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .link-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .link-section a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .link-section a:hover {
            text-decoration: underline;
        }

        .admin-link {
            text-align: center;
            margin-top: 15px;
        }

        .admin-link a {
            color: #999;
            text-decoration: none;
            font-size: 12px;
        }

        .messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 予約フォーム</h1>
        <p class="subtitle">以下のフォームにご記入の上、予約を確定してください</p>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" style="margin-top: 30px;">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">お名前<span class="required">*</span></label>
                <input type="text" id="name" name="name" value="{{ name }}" required placeholder="山田 太郎">
            </div>

            <div class="form-group">
                <label for="phone_number">電話番号<span class="required">*</span></label>
                <input type="tel" id="phone_number" name="phone_number" value="{{ phone_number }}" required placeholder="090-1234-5678">
            </div>

            <div class="form-group">
                <label for="email">メールアドレス<span class="required">*</span></label>
                <input type="email" id="email" name="email" value="{{ email }}" required placeholder="example@example.com">
            </div>

            <div class="form-group">
                <label for="reservation_date">予約日<span class="required">*</span></label>
                <input type="date" id="reservation_date" name="reservation_date" value="{{ reservation_date }}" required min="{{ today|date:'Y-m-d' }}">
            </div>

            <div class="form-group">
                <label for="reservation_time">予約時間<span class="required">*</span></label>
                <input type="time" id="reservation_time" name="reservation_time" value="{{ reservation_time }}" required>
            </div>

            <div class="form-group">
                <label for="service">サービス内容<span class="required">*</span></label>
                <input type="text" id="service" name="service" value="{{ service }}" required placeholder="例：カット、カラー、パーマ">
            </div>

            <div class="form-group">
                <label for="duration">所要時間（分）<span class="required">*</span></label>
                <input type="number" id="duration" name="duration" value="{% if duration %}{{ duration }}{% else %}60{% endif %}" required min="15" step="15">
            </div>

            <div class="form-group">
                <label for="memo">備考</label>
                <textarea id="memo" name="memo" placeholder="特記事項があればご記入ください">{{ memo }}</textarea>
            </div>

            <!-- 参考画像 -->
            <div class="form-group">
                <label for="reference_image">参考画像（任意）</label>
                
                <!-- セッションから復元された画像のサムネイル -->
                {% if temp_image_data %}
                <div id="session-preview" style="margin-bottom: 15px; padding: 15px; background: #f8f9fa; border: 2px solid #dee2e6; border-radius: 8px;">
                    <div style="margin-bottom: 10px;">
                        <strong>アップロード済み:</strong> {{ temp_image_name }}
                    </div>
                    <img src="data:image/jpeg;base64,{{ temp_image_data }}" alt="プレビュー" 
                        style="max-width: 300px; max-height: 300px; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <div style="margin-top: 10px;">
                        <button type="button" onclick="clearSessionImage()"
                            style="padding: 8px 15px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">
                            画像をクリア
                        </button>
                    </div>
                </div>

                <script>
                function clearSessionImage() {
                    if (confirm('アップロードした画像をクリアしてもよろしいですか？')) {
                        fetch('{% url "clear_temp_image" %}', {
                            method: 'POST',
                            headers: {
                                'X-CSRFToken': '{{ csrf_token }}',
                            },
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                // 画像部分だけを非表示
                                document.getElementById('session-preview').style.display = 'none';
                            }
                        });
                    }
                }
                </script>
                {% endif %}

                <input type="file" id="reference_image" name="reference_image" accept="image/*,.pdf" 
                    style="padding: 8px; width: 100%; border: 2px solid #ddd; border-radius: 5px;">

                <!-- 新規選択時のプレビュー -->
                <div id="new-image-preview" style="display: none; margin-top: 15px; padding: 15px; background: #f8f9fa; border: 2px solid #dee2e6; border-radius: 8px;">
                    <div style="margin-bottom: 10px;">
                        <strong>選択中:</strong> <span id="preview-filename"></span>
                    </div>
                    <img id="preview-image" src="" alt="プレビュー" 
                        style="max-width: 300px; max-height: 300px; border-radius: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                </div>

                <script>
                document.getElementById('reference_image').addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        // 画像ファイルの場合
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                document.getElementById('preview-image').src = e.target.result;
                                document.getElementById('preview-filename').textContent = file.name;
                                document.getElementById('new-image-preview').style.display = 'block';
                                const sessionPreview = document.getElementById('session-preview');
                                if (sessionPreview) sessionPreview.style.display = 'none';
                            };
                            reader.readAsDataURL(file);
                        } 
                        // PDFファイルの場合
                        else if (file.type === 'application/pdf') {
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                const typedarray = new Uint8Array(e.target.result);
                                
                                // PDF.jsでPDFを読み込み
                                pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                                    // 最初のページを取得
                                    pdf.getPage(1).then(function(page) {
                                        const scale = 1.5;
                                        const viewport = page.getViewport({ scale: scale });
                                        
                                        // Canvasを作成
                                        const canvas = document.createElement('canvas');
                                        const context = canvas.getContext('2d');
                                        canvas.height = viewport.height;
                                        canvas.width = viewport.width;
                                        
                                        // ページをCanvasに描画
                                        page.render({
                                            canvasContext: context,
                                            viewport: viewport
                                        }).promise.then(function() {
                                            // CanvasをImageに変換して表示
                                            document.getElementById('preview-image').src = canvas.toDataURL();
                                            document.getElementById('preview-filename').textContent = file.name;
                                            document.getElementById('new-image-preview').style.display = 'block';
                                            const sessionPreview = document.getElementById('session-preview');
                                            if (sessionPreview) sessionPreview.style.display = 'none';
                                        });
                                    });
                                });
                            };
                            reader.readAsArrayBuffer(file);
                        }
                    }
                });
                </script>

                <small style="display: block; color: #666; margin-top: 5px;">
                    ご希望のヘアスタイルなど、参考となる画像をアップロードしてください（JPG、PNG、PDF形式、10MB以下）
                </small>
                </div>

                <button type="submit">予約を確定する</button>
                </form>
        <script>
        // 日付入力のカスタムバリデーションメッセージ
        document.addEventListener('DOMContentLoaded', function() {
            const dateInput = document.getElementById('reservation_date');
    
            dateInput.addEventListener('invalid', function(e) {
                e.preventDefault();
                this.setCustomValidity('今日以降の日付を選択してください');
            });
    
            dateInput.addEventListener('input', function() {
                this.setCustomValidity('');
            });
        });
        </script>

        <div class="link-section">
            <a href="{% url 'public_booking_check' %}">📋 予約を確認する</a>
        </div>

        <div class="admin-link">
            <a href="{% url 'login' %}">管理者ログイン</a>
        </div>
    </div>
</body>
</html>
