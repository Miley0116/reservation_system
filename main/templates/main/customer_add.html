{% extends 'main/base.html' %}

{% block title %}顧客新規登録{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'admin-home' %}">ホーム</a></li>
        <li class="breadcrumb-item"><a href="{% url 'customer_list' %}">顧客一覧</a></li>
        <li class="breadcrumb-item active">新規登録</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<h2>顧客新規登録</h2>

<form method="post">
    {% csrf_token %}
    
    <div class="form-group">
        <label for="name">顧客名 <span style="color: red;">*</span></label>
        <input type="text" id="name" name="name" value="{{ name }}" required>    </div>
    
    <div class="form-group">
        <label for="phone_number">電話番号 <span style="color: red;">*</span></label>
        <input type="text" id="phone_number" name="phone_number" 
            pattern="^0\d{1,4}-?\d{1,4}-?\d{3,4}$"
            value="{{ phone_number }}"
            placeholder="例: 090-1234-5678" 
            title="正しい電話番号形式で入力してください（例: 090-1234-5678）"
            required>
        <small style="color: #666; font-size: 12px; display: block; margin-top: 5px;">
            ※ 090-1234-5678 または 09012345678 の形式で入力してください
        </small>
    </div>
    
    <div class="form-group">
        <label for="email">メールアドレス <span style="color: red;">*</span></label>
        <input type="email" id="email" name="email" value="{{ email }}" required>    </div>
    
    <div class="form-group">
        <label for="memo">メモ</label>
        <textarea id="memo" name="memo" rows="4" 
                  style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 14px; resize: vertical;">{{ memo }}</textarea>
    </div>
    
    <div class="form-group">
        <label for="last_visit_date">最終来店日</label>
        <input type="date" id="last_visit_date" name="last_visit_date" value="{{ last_visit_date }}">    </div>
    
    <button type="submit">登録</button>
    <a href="{% url 'customer_list' %}" style="text-decoration: none;">
        <button type="button" style="background: #6c757d; margin-top: 10px;">キャンセル</button>
    </a>
</form>
{% endblock %}
