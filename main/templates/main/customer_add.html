{% extends 'main/base.html' %}

{% block title %}顧客新規登録{% endblock %}

{% block content %}
<h2>顧客新規登録</h2>

<form method="post">
    {% csrf_token %}
    
    <div class="form-group">
        <label for="name">顧客名 <span style="color: red;">*</span></label>
        <input type="text" id="name" name="name" required>
    </div>
    
    <div class="form-group">
        <label for="phone_number">電話番号 <span style="color: red;">*</span></label>
        <input type="text" id="phone_number" name="phone_number" required>
    </div>
    
    <div class="form-group">
        <label for="memo">メモ</label>
        <textarea id="memo" name="memo" rows="4" 
                  style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 14px; resize: vertical;"></textarea>
    </div>
    
    <div class="form-group">
        <label for="last_visit_date">最終来店日</label>
        <input type="date" id="last_visit_date" name="last_visit_date">
    </div>
    
    <button type="submit">登録</button>
    <a href="{% url 'customer-list' %}" style="text-decoration: none;">
        <button type="button" style="background: #6c757d; margin-top: 10px;">キャンセル</button>
    </a>
</form>
{% endblock %}
