{% extends 'main/base.html' %}

{% block title %}予約編集{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>予約編集</h2>
    <a href="{% url 'reservation_list' %}" style="text-decoration: none; color: #667eea;">← 予約一覧に戻る</a>
</div>

<form method="POST">
    {% csrf_token %}
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
            <label for="customer">顧客 <span style="color: red;">*</span></label>
            <select name="customer" id="customer" required>
                {% for customer in customers %}
                <option value="{{ customer.pk }}" {% if customer.pk == reservation.customer.pk %}selected{% endif %}>
                    {{ customer.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="status">ステータス <span style="color: red;">*</span></label>
            <select name="status" id="status" required>
                <option value="pending" {% if reservation.status == 'pending' %}selected{% endif %}>予約中</option>
                <option value="completed" {% if reservation.status == 'completed' %}selected{% endif %}>完了</option>
                <option value="cancelled" {% if reservation.status == 'cancelled' %}selected{% endif %}>キャンセル</option>
            </select>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
            <label for="reservation_date">予約日 <span style="color: red;">*</span></label>
            <input type="date" name="reservation_date" id="reservation_date" 
                   value="{{ reservation.reservation_date|date:'Y-m-d' }}" required>
        </div>

        <div class="form-group">
            <label for="reservation_time">予約時間 <span style="color: red;">*</span></label>
            <input type="time" name="reservation_time" id="reservation_time" 
                   value="{{ reservation.reservation_time|time:'H:i' }}" required>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
        <div class="form-group">
            <label for="service">サービス内容 <span style="color: red;">*</span></label>
            <input type="text" name="service" id="service" value="{{ reservation.service }}" required>
        </div>

        <div class="form-group">
            <label for="duration">所要時間（分） <span style="color: red;">*</span></label>
            <input type="number" name="duration" id="duration" value="{{ reservation.duration }}" 
                   required min="15" step="15">
        </div>
    </div>

    <div class="form-group">
        <label for="memo">備考</label>
        <textarea name="memo" id="memo" rows="4" 
                  style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 14px; resize: vertical;">{{ reservation.memo }}</textarea>
    </div>

    <button type="submit">更新</button>
    <a href="{% url 'reservation_list' %}" style="text-decoration: none;">
        <button type="button" style="background: #6c757d; margin-top: 10px;">キャンセル</button>
    </a>
</form>
{% endblock %}
